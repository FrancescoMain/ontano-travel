name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Deploy to Firebase Dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build (dev)
        run: npx env-cmd -f .env.development npx react-scripts build
        env:
          CI: false

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --only hosting:quickferries-a95b3 --token ${{ secrets.FIREBASE_TOKEN }}
