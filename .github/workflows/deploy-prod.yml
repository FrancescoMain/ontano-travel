name: Deploy Prod

# Hotfix flow:
# 1. git checkout master && git pull
# 2. git checkout -b hotfix/<description>
# 3. Fix the issue, commit
# 4. Open PR targeting master
# 5. After merge to master: auto-deploys to prod
# 6. Back-merge: git checkout develop && git merge master && git push

on:
  push:
    branches:
      - master

jobs:
  deploy-prod:
    name: Deploy to Firebase Prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run tests before deploy
        run: npm run test:ci

      - name: Get version
        id: version
        run: echo "APP_VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version".*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT

      - name: Build (prod)
        run: npx env-cmd -f .env.production npx react-scripts build
        env:
          CI: false
          REACT_APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --only hosting:prodquickferries --token ${{ secrets.FIREBASE_TOKEN }}
